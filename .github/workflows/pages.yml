name: Build, test, and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_VOICE_WORKER_URL: ${{ vars.PUBLIC_VOICE_WORKER_URL }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install reportlab pypdf pypdfium2 pillow
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm resumes:verify
      - run: node scripts/verify_build.mjs
      - run: pnpm links:verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify production routes
        run: |
          curl --fail --retry 5 --retry-delay 5 https://zerunniu.github.io/ | grep -q "Reliable AI"
          curl --fail --retry 5 --retry-delay 5 https://zerunniu.github.io/projects/brave/ | grep -q "under review"
          curl --fail --retry 5 --retry-delay 5 https://zerunniu.github.io/agent-context.md | grep -q "first author"
          curl --fail --head https://zerunniu.github.io/assets/Zerun_Niu_Research_Engineer_Resume.pdf
          curl --fail --head https://zerunniu.github.io/assets/Zerun_Niu_Academic_CV.pdf
